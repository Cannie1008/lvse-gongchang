<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绿色工厂自评打分器（GB/T 36132—2025）</title>
<style>
:root{--paper:#F2F4F1;--surface:#FFFFFF;--ink:#1E2A24;--muted:#5E6E65;--line:#D3DDD6;--moss:#2F6B4F;--tint:#DCE7DF;--amber:#94661A;--amber-bar:#C08A2E;--amber-tint:#F6EBD6;--rust:#A8432F;--rust-tint:#F4DFD9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#111814;--surface:#18211C;--ink:#E3EAE5;--muted:#98A89E;--line:#2B3931;--moss:#86C3A0;--tint:#203128;--amber:#D8A657;--amber-bar:#D8A657;--amber-tint:#3A301E;--rust:#E58B74;--rust-tint:#3C2520;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
.num,.big,input{font-variant-numeric:tabular-nums}
header.top{max-width:1240px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 8px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:700}
.lede{color:var(--muted);margin:0;max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--moss);border-color:var(--moss);color:var(--paper)}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#msg{min-height:1.4em;margin:8px 0 0;font-size:13px;color:var(--muted)}
main{max-width:1240px;margin:0 auto;padding:8px 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:36px;align-items:start}
main>form,main>aside{min-width:0}
form section{padding:22px 0 14px;border-top:1px solid var(--line)}
form h2{font-size:17px;margin:0 0 2px}
.secnote{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:70ch}
.f{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center;padding:5px 0}
.f label{font-size:14px}
.hint{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.inwrap{display:flex;align-items:center;gap:6px}
.f input,.f select{width:100%;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.f input{text-align:right}
.f input.t{text-align:left}
.unit{color:var(--muted);font-size:12px;white-space:nowrap;min-width:44px}
.readout{margin-top:10px;padding:10px 12px;background:var(--tint);border-radius:6px;font-size:13px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px;margin:6px 0 12px}
.checks label{font-size:14px;display:flex;gap:8px;align-items:center;padding:3px 0}
.qual{padding:10px 0;border-top:1px dashed var(--line)}
.qual p{margin:0;font-size:14px;font-weight:600}
.opts{display:grid;gap:3px;margin-top:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.opts input{margin-top:4px}
.bmwrap{overflow-x:auto}
table.bm{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.bm th,table.bm td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.bm th{font-weight:600;color:var(--muted)}
table.bm input{width:100%;font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
table.bm td.act{white-space:nowrap;color:var(--muted)}
aside.ledger{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 20px 16px;max-height:calc(100vh - 32px);overflow:auto}
.who{margin:0;color:var(--muted);font-size:13px}
.scoreline{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.big{font-size:58px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--muted)}
.ruler{margin:26px 0 4px}
.track{position:relative;height:20px;border:1px solid var(--line);border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%)}
.seg{position:absolute;top:0;bottom:0;left:0}
.seg.c{background:var(--moss)}
.seg.p{background:repeating-linear-gradient(135deg,var(--amber-bar) 0 4px,transparent 4px 8px)}
.tick{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--ink)}
.tick span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;padding-bottom:2px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:-1px}
.legend .lc{background:var(--moss)}
.legend .lp{background:repeating-linear-gradient(135deg,var(--amber-bar) 0 3px,transparent 3px 6px);border:1px solid var(--amber-bar)}
.verdict{margin:14px 0 0;font-weight:600;padding:10px 12px;border-radius:6px;font-size:15px}
.tone-ok{background:var(--tint);color:var(--moss)}
.tone-mid{background:var(--amber-tint);color:var(--amber)}
.tone-bad{background:var(--rust-tint);color:var(--rust)}
.alert{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px}
.alert ul{margin:4px 0 0;padding-left:18px}
.block{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.block h3{font-size:14px;margin:0 0 8px}
.block p{font-size:13px;margin:6px 0 0}
ol.path,ul.gaps{margin:0;padding-left:20px;font-size:13px}
ol.path li,ul.gaps li{margin:3px 0}
.dim{color:var(--muted)}
.cat{display:grid;grid-template-columns:78px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.cat .v{text-align:right}
.bar{height:8px;background:var(--tint);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--moss)}
.bar b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--amber-bar) 0 3px,transparent 3px 6px)}
ul.inds{list-style:none;margin:0;padding:0;font-size:13px}
ul.inds li{display:grid;grid-template-columns:24px minmax(0,1fr) auto 66px;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
ul.inds .n{color:var(--muted)}
ul.inds .a{display:block;color:var(--muted);font-size:12px}
ul.inds .s{text-align:right}
.chip{font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap;justify-self:end}
.chip.full{background:var(--tint);color:var(--moss)}
.chip.partial{border:1px solid var(--line);color:var(--ink)}
.chip.zero{background:var(--rust-tint);color:var(--rust)}
.chip.gap{background:var(--amber-tint);color:var(--amber)}
details summary{cursor:pointer;font-size:14px;font-weight:600}
details ul{font-size:13px;padding-left:18px}
footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
footer p{max-width:90ch}
.mini{display:none}
@media (max-width:980px){
 main{grid-template-columns:1fr;gap:12px}
 aside.ledger{position:static;max-height:none}
 .mini{display:flex;position:sticky;top:0;z-index:5;gap:16px;align-items:baseline;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
 .mini b{font-size:20px}
 header.top{padding-top:18px}
}
@media (max-width:600px){
 .f{grid-template-columns:1fr;gap:4px}
 .checks{grid-template-columns:1fr}
 header.top,main,footer{padding-left:16px;padding-right:16px}
 .big{font-size:50px}
}
@media print{.mini,form,.actions,#msg{display:none!important} main{display:block} aside.ledger{position:static;max-height:none;border:0;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="mini" aria-hidden="true"><span>确定分 <b id="m-c">—</b></span><span>上限 <span id="m-u">—</span></span><span id="m-v"></span></div>
<header class="top">
  <h1>绿色工厂自评打分器</h1>
  <p class="lede">按 GB/T 36132—2025 和工信部年度评价要求的14项指标打分，看确定分、待定分、离分数线差多少，以及先做哪几件事最快过线。数据只保存在这台电脑的浏览器里，不联网。</p>
  <div class="actions">
    <button type="button" class="primary" id="b-demo">载入示例</button>
    <button type="button" id="b-clear">清空</button>
    <button type="button" id="b-export">导出数据（JSON）</button>
    <button type="button" id="b-import">导入数据</button>
    <button type="button" id="b-print">打印结果</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <p id="msg" role="status"></p>
</header>
<main>
  <form id="form" autocomplete="off" novalidate></form>
  <aside class="ledger" id="ledger" aria-live="polite"></aside>
</main>
<footer>

      try { fill(JSON.parse(String(rd.result).replace(/^\uFEFF/, ""))); render(); say("已导入：" + f.name); }
      catch (e) { say("导入失败：文件不是有效的 JSON。请导入本页导出的文件。"); }
      file.value = "";
    };
    rd.readAsText(f, "utf-8");
  });
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { saved = null; }
  fill(saved || DEMO);
  render();
  if (!saved) say("当前为演示数据（虚构企业）。改成你的数据后会自动保存在本机浏览器。");
  window.GFApp = { collect: collect, fill: fill, render: render };
})();
</script>
